<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Dental Facilities - Content Only</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #0ea5e9;
            --gradient-start: #0ea5e9;
            --gradient-end: #2563eb;
            --bg-light: #f8fafc;
        }

        body { 
            background-color: var(--bg-light); 
            font-family: 'Montserrat', sans-serif; 
            padding: 80px 0;
        }

        .section-header {
            text-align: center;
            margin-bottom: 70px;
        }

        .section-header h2 {
            font-weight: 800;
            font-size: 2.5rem;
            color: #0f172a;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        /* Facility Box Styling */
        .facility-box {
            position: relative;
            background: #ffffff;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border-left: 6px solid var(--primary-blue);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .facility-name {
            font-weight: 700;
            color: #334155;
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }

        /* Hover Effects: Pop-up & Gradient Background */
        .facility-box:hover {
            transform: scale(1.05) translateY(-5px);
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            box-shadow: 0 15px 30px rgba(14, 165, 233, 0.3);
            border-left-color: #fff;
        }

        .facility-box:hover .facility-name {
            color: #ffffff;
        }

        /* Subtle numbering on hover */
        .facility-box::after {
            content: '→';
            position: absolute;
            right: 20px;
            opacity: 0;
            color: white;
            transition: all 0.3s ease;
        }

        .facility-box:hover::after {
            opacity: 1;
            right: 15px;
        }

        @media (max-width: 991px) {
            .section-header h2 { font-size: 2rem; }
            .facility-box { height: 100px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="section-header">
        <h2>Advanced Facilities</h2>
        <p class="text-secondary">Precision Technology for Exceptional Dental Care</p>
    </div>

    <div class="row">
        <div class="col-lg-6 px-lg-4">
            <div class="facility-box">
                <span class="facility-name">Itero Scanner</span>
            </div>
            <div class="facility-box">
                <span class="facility-name">Italian OPG Machine</span>
            </div>
            <div class="facility-box">
                <span class="facility-name">Advanced Laser Machine</span>
            </div>
            <div class="facility-box">
                <span class="facility-name">B Class Autoclave</span>
            </div>
        </div>

        <div class="col-lg-6 px-lg-4">
            <div class="facility-box">
                <span class="facility-name">Best Implant Systems</span>
            </div>
            <div class="facility-box">
                <span class="facility-name">Physiodispenser</span>
            </div>
            <div class="facility-box">
                <span class="facility-name">Endo Motor for Rotary Endo</span>
            </div>
            <div class="facility-box">
                <span class="facility-name">Apex Locator</span>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
